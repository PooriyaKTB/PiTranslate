<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login / Sign Up - PiTranslate</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="login-signup.js"></script>
  </head>
  <body>
    <div class="auth-card">
      <h2 class="auth-title">Login / Sign Up</h2>

      <div class="auth-fields">
        <label for="email" class="auth-label">Email</label>
        <input type="email" id="email" placeholder="Email" />

        <label for="password" class="auth-label">Password</label>
        <input type="password" id="password" placeholder="Password" />
      </div>

      <div class="auth-actions">
        <button id="loginBtn" class="btn btn-primary">Login</button>
        <button id="signupBtn" class="btn btn-signup">Sign Up</button>
      </div>
      <div class="auth-actions">
        <button id="googleBtn" class="btn btn-google">
          Continue with Google
        </button>
      </div>

      <p id="error" class="auth-error"></p>

      <button class="back-home" id="backHomeBtn">
        ← Back to Home
      </button>
    </div>
  </body>
</html>
