<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — PiTranslate</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>"
    />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="login-signup.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="page-wrap">
        <a href="index.html" class="brand">🌍 PiTranslate</a>
        <div class="header-actions">
          <a href="app.html" class="btn btn-ghost">Continue as guest</a>
          <button class="btn btn-ghost icon-btn" data-theme-toggle></button>
        </div>
      </div>
    </header>

    <main class="auth-card">
      <form id="authForm" data-mode="login" novalidate>
        <h2 class="auth-title">
          <span class="login-only">Log in</span>
          <span class="signup-only">Create an account</span>
          <span class="reset-only">Reset password</span>
        </h2>
        <p class="auth-hint reset-only">
          Enter your email and we'll send you a link to reset your password.
        </p>

        <div class="auth-fields">
          <label for="name" class="auth-label signup-only">Name</label>
          <input
            type="text"
            id="name"
            class="signup-only"
            placeholder="What should we call you?"
            autocomplete="name"
            maxlength="50"
          />

          <label for="email" class="auth-label">Email</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
          />

          <label for="password" class="auth-label no-reset">Password</label>
          <input
            type="password"
            id="password"
            class="no-reset"
            placeholder="At least 6 characters"
            autocomplete="current-password"
          />

          <label for="language" class="auth-label signup-only">
            Translate into
          </label>
          <select id="language" class="signup-only"></select>
        </div>

        <div class="auth-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">
            <span class="login-only">Log in</span>
            <span class="signup-only">Sign up</span>
            <span class="reset-only">Send reset link</span>
          </button>
          <button type="button" id="googleBtn" class="btn no-reset">
            Continue with Google
          </button>
        </div>

        <p id="error" class="auth-error" role="alert"></p>
        <p id="info" class="auth-info" role="status"></p>

        <p class="auth-switch login-only">
          <button type="button" class="link-btn" data-switch="reset">
            Forgot password?
          </button>
        </p>
        <p class="auth-switch login-only">
          Don't have an account?
          <button type="button" class="link-btn" data-switch="signup">
            Sign up
          </button>
        </p>
        <p class="auth-switch signup-only">
          Already have an account?
          <button type="button" class="link-btn" data-switch="login">
            Log in
          </button>
        </p>
        <p class="auth-switch reset-only">
          <button type="button" class="link-btn" data-switch="login">
            ← Back to log in
          </button>
        </p>
      </form>
    </main>
  </body>
</html>
